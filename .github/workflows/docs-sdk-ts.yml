# MANUAL ONLY: this workflow never runs on its own.
#
# Builds the TypeScript SDK's API docs (typedoc) and deploys them to GitHub
# Pages.
# Moved from impl/sdk/ts/.github/workflows/docs.yaml (inert there: GitHub reads
# workflows only from the root
# .github/workflows/). Its release/push triggers were replaced with
# workflow_dispatch so nothing publishes until someone runs it on purpose.
#
# Before the first real run:
#   - add the secrets it reads: none, but GitHub Pages must be enabled for this
#     repository with GitHub Actions as the source
#   - decide the monorepo's tag scheme; every subproject used to tag `vX.Y.Z`
#     in its own repository, which collides here. It takes no tag.
#   - it has not yet been exercised from the monorepo; do a dry run first.
#
name: docs-sdk-ts

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write


defaults:
  run:
    working-directory: impl/sdk/ts

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm install
      - name: Build docs
        run: npm run docs
      - name: Archive artifact # from: https://github.com/actions/upload-pages-artifact
        shell: sh
        run: |
          echo ::group::Archive artifact
          tar \
            --dereference --hard-dereference \
            --directory docs \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
          echo ::endgroup::
      - name: Upload artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
