# The Rust SDK's CI, moved to the repository root so Actions can find it.
# See server-core-ci.yml for why every sub-project's own `.github/` is inert.
#
# `working-directory` applies to `run:` steps only, never to `uses:` steps, so
# anything an action resolves itself is spelled from the workspace root here:
# the cache's workspace, and the schema checked out beside it.

name: sdk-rs

on:
  push:
    branches: [main]
    paths:
      - "impl/sdk/rs/**"
      - ".github/workflows/sdk-rs-ci.yml"
  pull_request:
    paths:
      - "impl/sdk/rs/**"
      - ".github/workflows/sdk-rs-ci.yml"
  workflow_dispatch:

env:
  RUSTFLAGS: "-D warnings"

defaults:
  run:
    working-directory: impl/sdk/rs

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/sdk/rs
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/sdk/rs
      - run: cargo test --workspace

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/sdk/rs

      - name: Start Resonate server
        run: |
          docker run -d --name resonate \
            -p 8001:8001 \
            resonatehqio/resonate:latest
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8001/ 2>&1; then
              echo "Resonate server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Resonate server failed to start within 60s" >&2
          docker logs resonate || true
          exit 1

      - name: Run e2e tests
        env:
          RESONATE_URL: http://localhost:8001
        run: cargo test -p resonate-sdk --test e2e

      - name: Dump server logs on failure
        if: failure()
        run: docker logs resonate || true

      - name: Stop Resonate server
        if: always()
        run: docker rm -f resonate || true

  e2e-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: resonatehq/resonate-pg
          path: resonate-pg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/sdk/rs

      # resonate-pg is checked out at the workspace root, so the schema is
      # named from there rather than from this job's working directory.
      - name: Start Postgres and apply the resonate-pg schema
        run: |
          docker run -d --name resonate-pg \
            -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            postgres:16
          for i in $(seq 1 60); do
            if docker exec resonate-pg pg_isready -U postgres >/dev/null 2>&1; then
              echo "Postgres is up."
              break
            fi
            sleep 1
          done
          docker exec -i resonate-pg psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f - < "${{ github.workspace }}/resonate-pg/resonate.sql"

      - name: Run postgres e2e tests
        env:
          RESONATE_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test -p resonate-sdk-postgres --test e2e

      - name: Dump Postgres logs on failure
        if: failure()
        run: docker logs resonate-pg || true

      - name: Stop Postgres
        if: always()
        run: docker rm -f resonate-pg || true
