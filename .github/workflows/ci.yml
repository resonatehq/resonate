name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      # clippy fully compiles the crate, so a separate build step is redundant
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # --workspace, or the members' own tests are silently skipped: this is a
      # workspace with a root package, so a bare `cargo test` selects only that.
      - name: Test
        run: cargo test --workspace --all-features

  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        STORAGE: [sqlite, postgres, mysql]

    steps:
      - name: Checkout resonate-server-rs
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout resonate-testbed
        uses: actions/checkout@v5
        with:
          repository: resonatehq/resonate-test
          token: ${{ secrets.TESTBED_TOKEN }}
          path: test/resonate-test

      - name: Checkout resonate-perf
        uses: actions/checkout@v5
        with:
          repository: resonatehq/resonate-perf
          token: ${{ secrets.TESTBED_TOKEN }}
          path: test/resonate-perf

      - name: Run tests
        run: |
          make test STORAGE=${{ matrix.STORAGE }}
        env:
          DOCKER_BUILDKIT: 1

      - name: Teardown
        if: always()
        run: make clean
