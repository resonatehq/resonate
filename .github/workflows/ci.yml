name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      # clippy fully compiles the crate, so a separate build step is redundant
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # --workspace, or the members' own tests are silently skipped: this is a
      # workspace with a root package, so a bare `cargo test` selects only that.
      - name: Test
        run: cargo test --workspace --all-features

      # The blob crate's oracle is a deliberate copy of the dbms oracle, and
      # the extraction decision (plan.md, Phase 8) is read off this diff. It
      # is printed, never failed on: the drift must be visible, not forbidden.
      - name: Oracle drift ledger
        run: |
          if diff -u crates/resonate-server-dbms/src/oracle.rs \
                     crates/resonate-server-blob/src/oracle.rs; then
            echo "oracle copies are identical"
          else
            echo "oracle copies differ — expected while the cuts are structural; see plan.md"
          fi

  differential:
    name: Differential (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres, mysql]

    # Services cannot be selected per matrix leg, so both start everywhere
    # and the step below picks the one this leg talks to.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resonate
          POSTGRES_PASSWORD: resonate
          POSTGRES_DB: resonate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: resonate
          MYSQL_USER: resonate
          MYSQL_PASSWORD: resonate
          MYSQL_DATABASE: resonate
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uresonate -presonate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # --release: the run walks to a coverage plateau or 200k steps, which
      # a debug build turns from minutes into an afternoon.
      - name: Differential
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          case "$BACKEND" in
            postgres)
              export TEST_POSTGRES_URL=postgres://resonate:resonate@localhost:5432/resonate
              ;;
            mysql)
              export TEST_MYSQL_URL=mysql://resonate:resonate@localhost:3306/resonate
              ;;
          esac
          cargo test --release --test differential --all-features -- --nocapture

  # ═══════════════════════════════════════════════════════════════════════════
  # The Zig implementation on an object store (`zig/`)
  # ═══════════════════════════════════════════════════════════════════════════

  # Hermetic: one process, one seed, no sockets and no wall clock. A failing
  # seed is printed with the command that reproduces it byte for byte.
  zig:
    name: Zig (tests and simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: zig

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.1

      - name: Test
        run: zig build test

      # --release: the linearizability search is the whole cost of a soak, and a
      # debug build turns minutes into an afternoon.
      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      # Two shapes of trouble: a store that loses races and reorders its
      # answers, and a store that stops answering while servers are killed
      # mid-decision. Both also check, after every operation, that every
      # deadline a document records still has an object to fire it.
      # Ten seeds, searched to the full depth rather than more seeds searched
      # shallowly: a run that gives up proves nothing either way, and a step that
      # mostly gives up is a step that mostly says nothing. The thousands of seeds
      # are in the sweep below, where there is no search to run out of.
      - name: Simulate (races)
        run: |
          zig-out/bin/simulator soak --runs 10 --servers 3 --clients 4 \
            --operations 200 --conflict 15 --reorder 30 --unavailable 3 --lost-ack 3

      - name: Simulate (faults and crashes)
        run: |
          zig-out/bin/simulator soak --runs 10 --servers 3 --clients 4 \
            --operations 200 --unavailable 5 --lost-ack 5 --crash 2

      # The one path debug mode cannot reach: a server that comes up, reads the
      # deadlines out of the bucket, and fires one on wall time with nobody
      # asking. Both checks above run with the clock in the caller's hands.
      - name: A deadline survives a restart
        run: tools/deadline-survives-a-restart.sh

      # With the search off a run costs milliseconds, so this is thousands of
      # seeds rather than tens — and what it still checks is everything a
      # linearizability search cannot see: a 5xx, a deadline with no object to
      # fire it, and work that nothing will ever hand on.
      - name: Simulate (a wide sweep, invariants only)
        run: |
          zig-out/bin/simulator soak --runs 3000 --servers 4 --clients 6 \
            --operations 400 --conflict 20 --reorder 40 \
            --unavailable 5 --lost-ack 5 --crash 2 --no-check

  # The same two questions the Rust tree asks of itself, asked of the Zig
  # server: does it answer what the reference answers, and is a real concurrent
  # history over real sockets linearizable.
  zig-differential:
    name: Zig against the reference
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build
        run: |
          cargo build --release --bin resonate --example conctrace
          cd zig && zig build -Doptimize=ReleaseSafe

      # Debug mode on both: the clock belongs to the caller, so time is an input
      # rather than a race, `debug.snap` answers, and nothing runs on wall time.
      # The blob server is the peer because it holds its messages for the
      # snapshot, as the Zig server does — a backend that delivers them would
      # make that section a report on delivery rather than on what was decided.
      - name: Start both servers
        run: |
          ./zig/zig-out/bin/resonate serve --debug --store memory --port 8021 &
          ./target/release/resonate serve --debug --server-port 8022 --level error \
            --set servers.active=server_blob \
            --set servers.server_blob.search_enabled=true \
            --set servers.server_blob.retry_timeout=30000 &
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8021/ready && break
            sleep 1
          done
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null -X POST http://127.0.0.1:8022/ \
              -H 'Content-Type: application/json' \
              -d '{"kind":"debug.snap","head":{"corrId":"r","version":"2026-04-01","resonate:debug_time":1},"data":{}}' && break
            sleep 1
          done

      # `--store memory` and `--store s3` are the same server over two
      # implementations of one port, and the memory one is not the one that
      # ships. `fakes3` answers the six operations the port has, with real
      # conditional writes, so the S3 path can be run without an S3.
      - name: Start the Zig server over a stand-in S3
        run: |
          ./zig/zig-out/bin/fakes3 --port 9100 &
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null "http://127.0.0.1:9100/b?list-type=2&prefix=" && break
            sleep 1
          done
          ./zig/zig-out/bin/resonate serve --debug --store s3 \
            --endpoint http://127.0.0.1:9100 --bucket b --port 8031 &
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8031/ready && break
            sleep 1
          done

      # Printed, never failed on, and for the same reason as the oracle drift
      # ledger above: the two known differences are ones the Zig server is
      # deliberately on the other side of — `task.create` on an already
      # fulfilled task carries the branch preload, which is what the oracle and
      # both SQL engines do, and a sweep catches a schedule up across every
      # boundary it crossed, which is what the blob server does. A new
      # difference has to be visible, and a difference is not a build break.
      - name: Differential ledger
        run: |
          echo "── over the memory store ──"
          ./zig/zig-out/bin/differ --a http://127.0.0.1:8021/ --label-a zig \
            --b http://127.0.0.1:8022/ --label-b blob \
            --seed 1 --operations 1000 --keep-going || true
          echo "── over the S3 path ──"
          ./zig/zig-out/bin/differ --a http://127.0.0.1:8031/ --label-a zig-s3 \
            --b http://127.0.0.1:8022/ --label-b blob \
            --seed 5 --operations 400 --keep-going || true

      # This one is a check: the producer refuses a history with no successes or
      # no overlap, and the checker asks whether *any* order consistent with the
      # recorded instants explains every answer.
      - name: Record and check a real history
        run: |
          ./target/release/examples/conctrace \
            --url http://127.0.0.1:8021/ --out trace --clients 8 --ops 600
          ./zig/zig-out/bin/simulator check trace.history

      # The same question of the path that talks to an object store.
      - name: Record and check a real history over the S3 path
        run: |
          ./target/release/examples/conctrace \
            --url http://127.0.0.1:8031/ --out trace-s3 --clients 8 --ops 600
          ./zig/zig-out/bin/simulator check trace-s3.history

  # Porcupine, from the specification repository, against a live server under
  # real concurrency.
  #
  # The checker is upstream's, unmodified. Only the trace producer is ours:
  # `loadgen` there opens with `debug.start`, which is a startup flag here and
  # answers 400, and it builds ids like `c0.a0` where this server's origin is
  # everything before the first ':'.
  #
  # `conccheck`, not `lincheck`. `lincheck` asks whether the ONE order the
  # harness recorded satisfies the model, and on a concurrent run refutes
  # almost anything, because return order is one legal linearization of many.
  # `conccheck` reads the real call/return instants and asks whether ANY order
  # consistent with them works — only its refutation is a claim about the
  # server.
  #
  # `-partition=false` because upstream's `originOf` splits on '.', so it reads
  # every ':'-id as its own partition. Unpartitioned replays against whole
  # state, which is the stronger check anyway.
  linearizability:
    name: Linearizability (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres, mysql, blob]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resonate
          POSTGRES_PASSWORD: resonate
          POSTGRES_DB: resonate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: resonate
          MYSQL_USER: resonate
          MYSQL_PASSWORD: resonate
          MYSQL_DATABASE: resonate
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uresonate -presonate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout resonate-specification
        uses: actions/checkout@v5
        with:
          repository: resonatehq/resonate-specification
          path: spec

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: spec/valid/porc/go.mod

      - name: Build
        run: cargo build --release --bin resonate --example conctrace

      # Debug mode is what makes a history checkable: the clock belongs to the
      # caller, so every request carries the `resonate:debug_time` the model's
      # non-decreasing clock needs, and no background sweep settles anything
      # the trace did not ask for.
      - name: Start server
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          case "$BACKEND" in
            postgres)
              export RESONATE_SERVERS__ACTIVE=server_postgres
              export RESONATE_SERVERS__SERVER_POSTGRES__URL=postgres://resonate:resonate@localhost:5432/resonate
              ;;
            mysql)
              export RESONATE_SERVERS__ACTIVE=server_mysql
              export RESONATE_SERVERS__SERVER_MYSQL__URL=mysql://resonate:resonate@localhost:3306/resonate
              ;;
            blob)
              # No bucket configured: the blob backend runs against its
              # in-process, in-memory object store, which has real
              # conditional-write semantics — the concurrency is still real.
              export RESONATE_SERVERS__ACTIVE=server_blob
              ;;
            *)
              export RESONATE_SERVERS__ACTIVE=server_sqlite
              export RESONATE_SERVERS__SERVER_SQLITE__PATH=/tmp/conccheck.db
              ;;
          esac
          RESONATE_DEBUG=true RESONATE_GATEWAYS__GATEWAY_HTTP__BIND=0.0.0.0:8021 ./target/release/resonate serve &
          ready=false
          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8021/ready; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "server did not become ready"
            exit 1
          fi

      # The producer exits non-zero on a history with no successes or no
      # overlap, so a server that refuses everything, or a run that failed to
      # be concurrent, fails here rather than linearizing vacuously.
      - name: Record history
        run: |
          ./target/release/examples/conctrace \
            --url http://127.0.0.1:8021/ --out trace --clients 8 --ops 600

      - name: Check
        working-directory: spec/valid/porc
        run: go run ./cmd/conccheck -partition=false < "$GITHUB_WORKSPACE/trace.history"
