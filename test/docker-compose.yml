services:
  mysql:
    image: mysql:8.0
    profiles: [mysql, mysql-auth]
    environment:
      MYSQL_ROOT_PASSWORD: resonate
      MYSQL_USER: resonate
      MYSQL_PASSWORD: resonate
      MYSQL_DATABASE: resonate
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "resonate", "-presonate"]
      interval: 2s
      timeout: 5s
      retries: 30
    logging:
      driver: "none"
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - resonate

  postgres:
    image: postgres:16-alpine
    profiles: [postgres, postgres-auth]
    environment:
      POSTGRES_USER: resonate
      POSTGRES_PASSWORD: resonate
      POSTGRES_DB: resonate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonate"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "none"
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - resonate

  resonate-server-sqlite:
    build: ..
    profiles: [sqlite]
    environment:
      - RESONATE_GATEWAYS__GATEWAY_HTTP__PORT=8001
      - RESONATE_GATEWAYS__GATEWAY_METRICS__BIND=0.0.0.0:9090
      - RESONATE_LEVEL=error
      - RESONATE_DEBUG=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8001/ready || exit 1"]
      interval: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "none"
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - resonate

  resonate-server-postgres:
    build: ..
    profiles: [postgres]
    environment:
      - RESONATE_GATEWAYS__GATEWAY_HTTP__PORT=8001
      - RESONATE_GATEWAYS__GATEWAY_METRICS__BIND=0.0.0.0:9090
      - RESONATE_LEVEL=error
      - RESONATE_SERVERS__ACTIVE=server_postgres
      - RESONATE_SERVERS__SERVER_POSTGRES__URL=postgres://resonate:resonate@postgres:5432/resonate
      - RESONATE_SERVERS__SERVER_POSTGRES__POOL_SIZE=20
      - RESONATE_DEBUG=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8001/ready || exit 1"]
      interval: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "none"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - resonate

  resonate-server-mysql:
    build: ..
    profiles: [mysql]
    environment:
      - RESONATE_GATEWAYS__GATEWAY_HTTP__PORT=8001
      - RESONATE_GATEWAYS__GATEWAY_METRICS__BIND=0.0.0.0:9090
      - RESONATE_LEVEL=error
      - RESONATE_SERVERS__ACTIVE=server_mysql
      - RESONATE_SERVERS__SERVER_MYSQL__URL=mysql://resonate:resonate@mysql:3306/resonate
      - RESONATE_SERVERS__SERVER_MYSQL__POOL_SIZE=20
      - RESONATE_DEBUG=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8001/ready || exit 1"]
      interval: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "none"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - resonate

  resonate-server-sqlite-auth:
    build: ..
    profiles: [sqlite-auth]
    environment:
      - RESONATE_GATEWAYS__GATEWAY_HTTP__PORT=8001
      - RESONATE_GATEWAYS__GATEWAY_METRICS__BIND=0.0.0.0:9090
      - RESONATE_LEVEL=error
      - RESONATE_DEBUG=true
      - RESONATE_GATEWAYS__GATEWAY_HTTP__AUTH__PUBLICKEY=/etc/resonate/auth/public.pem
      - RESONATE_GATEWAYS__GATEWAY_WEB__AUTH__PUBLICKEY=/etc/resonate/auth/public.pem
      - RESONATE_WORKERS__TRANSPORT_HTTP_POLL__AUTH__PUBLICKEY=/etc/resonate/auth/public.pem
    volumes:
      - ../config/auth/dev/public.pem:/etc/resonate/auth/public.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8001/ready || exit 1"]
      interval: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "none"
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - resonate

  resonate-server-mysql-auth:
    build: ..
    profiles: [mysql-auth]
    environment:
      - RESONATE_GATEWAYS__GATEWAY_HTTP__PORT=8001
      - RESONATE_GATEWAYS__GATEWAY_METRICS__BIND=0.0.0.0:9090
      - RESONATE_LEVEL=error
      - RESONATE_SERVERS__ACTIVE=server_mysql
      - RESONATE_SERVERS__SERVER_MYSQL__URL=mysql://resonate:resonate@mysql:3306/resonate
      - RESONATE_SERVERS__SERVER_MYSQL__POOL_SIZE=20
      - RESONATE_DEBUG=true
      - RESONATE_GATEWAYS__GATEWAY_HTTP__AUTH__PUBLICKEY=/etc/resonate/auth/public.pem
      - RESONATE_GATEWAYS__GATEWAY_WEB__AUTH__PUBLICKEY=/etc/resonate/auth/public.pem
      - RESONATE_WORKERS__TRANSPORT_HTTP_POLL__AUTH__PUBLICKEY=/etc/resonate/auth/public.pem
    volumes:
      - ../config/auth/dev/public.pem:/etc/resonate/auth/public.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8001/ready || exit 1"]
      interval: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "none"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - resonate

  resonate-server-postgres-auth:
    build: ..
    profiles: [postgres-auth]
    environment:
      - RESONATE_GATEWAYS__GATEWAY_HTTP__PORT=8001
      - RESONATE_GATEWAYS__GATEWAY_METRICS__BIND=0.0.0.0:9090
      - RESONATE_LEVEL=error
      - RESONATE_SERVERS__ACTIVE=server_postgres
      - RESONATE_SERVERS__SERVER_POSTGRES__URL=postgres://resonate:resonate@postgres:5432/resonate
      - RESONATE_SERVERS__SERVER_POSTGRES__POOL_SIZE=20
      - RESONATE_DEBUG=true
      - RESONATE_GATEWAYS__GATEWAY_HTTP__AUTH__PUBLICKEY=/etc/resonate/auth/public.pem
      - RESONATE_GATEWAYS__GATEWAY_WEB__AUTH__PUBLICKEY=/etc/resonate/auth/public.pem
      - RESONATE_WORKERS__TRANSPORT_HTTP_POLL__AUTH__PUBLICKEY=/etc/resonate/auth/public.pem
    volumes:
      - ../config/auth/dev/public.pem:/etc/resonate/auth/public.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8001/ready || exit 1"]
      interval: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "none"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - resonate

networks:
  resonate:
    driver: bridge
