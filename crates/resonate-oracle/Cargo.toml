[package]
name = "resonate-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Resonate's reference model, in memory: what the differential compares every server against."

# Not resonate-server-*. That prefix means a server plugin you register and
# run, and next to resonate-server-postgres and -mysql it would read as an
# Oracle Database backend, which is the opposite of what this is. It satisfies
# ResonateServer so the comparison can run through the port, and that is all.

[dependencies]
resonate-sql = { path = "../resonate-sql" }
resonate-core = { path = "../resonate-core" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }
tracing = "0.1"

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
