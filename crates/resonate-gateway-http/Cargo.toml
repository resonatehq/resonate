[package]
name = "resonate-gateway-http"
description = "The HTTP gateway: axum in front of a Resonate server, including the poll/SSE endpoint."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "resonate_gateway_http"
path = "src/lib.rs"

[dependencies]
resonate-auth = { path = "../resonate-auth" }
resonate-core = { path = "../resonate-core" }
resonate-plugin = { path = "../resonate-plugin" }
async-trait = { workspace = true }
serde = { workspace = true }
tower-http = { version = "0.6", features = ["trace", "catch-panic", "cors"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "signal", "net"] }
serde_json = { workspace = true }
lazy_static = "1"
tracing = "0.1"

[dev-dependencies]
# The auth-priority test drives the API route the way a caller does.
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
