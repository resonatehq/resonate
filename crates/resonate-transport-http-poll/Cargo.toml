[package]
name = "resonate-transport-http-poll"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Resonate transport: deliver messages to a worker that holds an open SSE connection, for workers that cannot be dialled."

[dependencies]
resonate-core = { path = "../resonate-core" }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "macros"] }
tracing = "0.1"
fastrand = "2"
url = { workspace = true }
