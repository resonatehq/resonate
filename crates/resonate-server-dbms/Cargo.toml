[package]
name = "resonate-server-dbms"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Resonate server storage over a relational database: the Db contract and its SQLite, PostgreSQL and MySQL implementations."

[features]
# Extra interleaving assertions in the transaction paths, for stress runs.
concurrency-stress = []

[dependencies]
resonate-core = { path = "../resonate-core" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }
tracing = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
sqlx = { version = "0.8", features = ["postgres", "mysql", "runtime-tokio-rustls", "macros"] }
