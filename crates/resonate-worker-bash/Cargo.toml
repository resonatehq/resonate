[package]
name = "resonate-worker-bash"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Resonate worker: runs a task's script locally, in Docker, or in a Tensorlake sandbox."

[dependencies]
resonate-core = { path = "../resonate-core" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
tokio = { version = "1", features = ["rt", "process", "time", "macros"] }
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
fastrand = "2"
