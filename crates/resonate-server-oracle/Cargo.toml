[package]
name = "resonate-server-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Resonate server: the reference model, in memory. What the differential compares every other server against."

[dependencies]
resonate-sql = { path = "../resonate-sql" }
resonate-core = { path = "../resonate-core" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }
tracing = "0.1"

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
