[package]
name = "resonate-cli"
description = "The Resonate CLI client: promise, task and schedule operations over HTTP, and the MCP server."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "resonate_cli"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
