[package]
name = "resonate-auth"
description = "Bearer-token authentication and per-operation authorization for the Resonate protocol."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "resonate_auth"
path = "src/lib.rs"

[dependencies]
resonate-core = { path = "../resonate-core" }
jsonwebtoken = "9"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt"] }
