\* THE model configuration.  There is only one -- see the header of
\* Unified.tla for why there are no longer per-implementation profiles.
SPECIFICATION Spec
CONSTANTS
    a = a
    b = b
    wA = wA
    wB = wB
    L = L
    Ids     <- MCIds
    Addrs   <- MCAddrs
    Workers <- MCWorkers
    MaxTime    = 2
    MaxVersion = 2
    Retry = 1
    Ttl   = 1
    TTLs  = {1}
    FaultsOn = TRUE
CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE
\* Listed individually, NOT as the `Safety` conjunction: TLC names the
\* invariant it violated, so a conjunction loses the attribution that makes
\* a mutation experiment informative.
INVARIANT
    TypeOK
    TaskHasPromise
    TaskHasAtMostOneTimer
    NonAcquiredTaskHasNoPid
    CallbackNotSelfReferential
    SuspendedTaskHasCallback
    SettledPromiseHasNoSubscriptions
    ObligationsAreDischargeable
    ArmingIsExternalOnly
    NoDeadDispatch
    NoHaltOnDead
    Stickiness
    NoStrandedListener
    NoStrandedTask
    TaskPromiseCoherence
    AtMostOneValidClaim
    OutboxNeverAhead
    ResponsesNeverRegress
    ResponsesAreProjected
    TaskResponsesNeverRegress
    TaskResponsesAreProjected
