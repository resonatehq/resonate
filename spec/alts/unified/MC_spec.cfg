\* THE SPECIFICATION PROFILE: every guard on. All properties must hold.
SPECIFICATION Spec
CONSTANTS
    a = a
    b = b
    wA = wA
    wB = wB
    L = L
    Ids     <- MCIds
    Addrs   <- MCAddrs
    Workers <- MCWorkers
    MaxTime    = 2
    MaxVersion = 2
    Retry = 1
    Ttl   = 1
    ArmPolicy = "external"
    CallbackExternalGuard = TRUE
    ListenerExternalGuard = TRUE
    PromiseLivenessGuard  = TRUE
    TimeoutLivenessGuard  = TRUE
    ResumeLivenessGuard   = TRUE
    HeartbeatGuard        = TRUE
    SequencedDriver       = FALSE
    FaultsOn              = TRUE
CONSTRAINT StateConstraint
CHECK_DEADLOCK FALSE
INVARIANT Safety
