\* A model small enough to be checked and large enough to interleave.
\*
\* |Rid| = 2 is the point of the whole exercise: one step is the Lean
\* machine, two is where a Process can land between another step's Process
\* and its last Perform. |Rest| = 2 gives two objects under one origin, so
\* a callback can be same-origin; add a second Origin to test the other
\* half of `SameOrigin`.
\*
\* Uninterpreted-type values are written in Apalache's `name_OF_TYPE` form.

CONSTANTS
    Origin       = {"o1_OF_ORIGIN"}
    Rest         = {"a_OF_REST", "b_OF_REST"}
    Address      = {"addr1_OF_ADDR"}
    Pid          = {"pid1_OF_PID"}
    Value        = {"val_OF_VALUE"}
    Tags         = {"tags_OF_TAGS"}
    Ttl          = {1}
    Rid          = {"q1_OF_RID", "q2_OF_RID"}
    NoPid        = "nopid_OF_PID"
    NoAddr       = "noaddr_OF_ADDR"
    Silent       = "silent_OF_RESPONSE"
    Materialise  = TRUE
    RetryTimeout = 2
    MaxTime      = 2
    MaxVersion   = 1

INIT Init
NEXT Next

INVARIANT
    TypeOK
    WheelSound
    WheelComplete
    UnitCoherent
