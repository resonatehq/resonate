\* A model small enough to check and large enough to interleave.
\*
\* |Rid| = 2 is the point: one step is the Lean machine, two is where a
\* Process can land between another step's Process and its last Perform.
\*
\* ONE identifier, and that is not a loss. The four catalogue entries that
\* span two objects are exactly the ones not yet ported, and the race this
\* module exists to expose is two steps on the SAME object. A second `Rest`
\* doubles every quantifier to test nothing that is being asked.
\*
\* MaxTime = 1 is the smallest clock that still lets a deadline pass:
\* create at 0 with timeoutAt = 1, tick, and the timeout is due.

CONSTANTS
    Origin       = {"o1_OF_ORIGIN"}
    Rest         = {"a_OF_REST"}
    Address      = {"addr1_OF_ADDR"}
    Pid          = {"pid1_OF_PID"}
    Value        = {"val_OF_VALUE"}
    Rid          = {"q1_OF_RID", "q2_OF_RID"}
    Ttl          = {1}
    NoPid        = "nopid_OF_PID"
    NoAddr       = "noaddr_OF_ADDR"
    NoValue      = "noval_OF_VALUE"
    Silent       = "silent_OF_RESPONSE"
    Materialise  = TRUE
    RetryTimeout = 2
    MaxTime      = 1
    MaxVersion   = 1

INIT Init
NEXT MCNext
