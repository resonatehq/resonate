[package]
name = "resonate-worker-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Resonate worker: runs each task inside an isolated sandbox, relaying its protocol traffic over the sandbox's stdio."

[dependencies]
resonate-plugin = { path = "../resonate-plugin" }
resonate-sandbox = { path = "../resonate-sandbox" }
resonate-sandbox-microsandbox = { path = "../resonate-sandbox-microsandbox" }
resonate-sandbox-tensorlake = { path = "../resonate-sandbox-tensorlake" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "process", "time", "macros", "sync", "io-util"] }
tracing = "0.1"
libc = "0.2"

[dev-dependencies]
# The end-to-end test runs a real server with this worker registered, and rn8
# as the "sandbox" command.
resonate-base = { path = "../resonate-base" }
resonate-server-sqlite = { path = "../resonate-server-sqlite" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
base64 = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
resonate-sandbox-tensorlake = { path = "../resonate-sandbox-tensorlake", features = ["fake"] }
