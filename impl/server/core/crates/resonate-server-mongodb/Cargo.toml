[package]
name = "resonate-server-mongodb"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Resonate server: durable state in MongoDB — one document per promise, callbacks and resumes as arrays, one multi-document transaction per transition."

# Depends on no other plugin, and on no other server's library. Like Neo4j's,
# the engine and the shell are a copy of ScyllaDB's, so the copies can be
# diffed and any divergence between them read off rather than argued.

[dependencies]
resonate-core = { path = "../resonate-core" }
resonate-plugin = { path = "../resonate-plugin" }
resonate-timer-wheel = { path = "../resonate-timer-wheel" }
# bson 3, not the default bson 2: bson 2 turns on serde_json's
# `preserve_order` for the whole binary, which reorders every JSON map every
# backend writes and grows `serde_json::Value` past clippy's large-error limit.
mongodb = { version = "3.9", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
futures-util = { version = "0.3", default-features = false }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1"
lazy_static = "1"
