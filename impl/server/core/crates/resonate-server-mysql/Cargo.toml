[package]
name = "resonate-server-mysql"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Resonate server: durable state in MySQL."

[features]
concurrency-stress = []

[dependencies]
resonate-sql = { version = "0.10.1", path = "../resonate-sql", features = ["mysql"] }
resonate-core = { version = "0.10.1", path = "../resonate-core" }
resonate-plugin = { version = "0.10.1", path = "../resonate-plugin" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
validator = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }
tracing = "0.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "macros", "migrate", "mysql"] }

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
