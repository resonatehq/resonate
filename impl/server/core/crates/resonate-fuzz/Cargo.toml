[package]
name = "resonate-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A coverage-guided, oracle-informed fuzzer that drives a real Resonate server over HTTP."

# A standalone program, not a plugin: it talks to a server only through the
# protocol, so it can drive any implementation — and run inside a skulld guest.
[[bin]]
name = "resonate-fuzz"
path = "src/main.rs"

[dependencies]
resonate-core = { path = "../resonate-core" }
resonate-oracle = { path = "../resonate-oracle" }
resonate-sql = { path = "../resonate-sql" }
serde_json = { workspace = true }
clap = { workspace = true }
fastrand = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false }
libc = "0.2"
