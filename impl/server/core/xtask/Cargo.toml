[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false
description = "The one way to run what CI runs: cargo xtask <job>."

[dependencies]
clap = { workspace = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "mysql"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = { workspace = true }
