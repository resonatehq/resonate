[workspace]
members = [
    "crates/resonate-auth",
    "crates/resonate-core",
    "crates/resonate-gateway-http",
    "crates/resonate-gateway-web",
    "crates/resonate-server-blob",
    "crates/resonate-server-dbms",
    "crates/resonate-timer-wheel",
    "crates/resonate-transport-gcps",
    "crates/resonate-transport-http-poll",
    "crates/resonate-transport-http-push",
    "crates/resonate-worker-bash",
]

[workspace.package]
version = "0.10.1"
edition = "2021"
license = "Apache-2.0"

# Shared with the workspace members so a version bump happens in one place.
[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
validator = { version = "0.18", features = ["derive"] }

[package]
name = "resonate"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "resonate"
path = "src/lib.rs"

[[bin]]
name = "resonate"
path = "src/main.rs"

[[test]]
name = "differential"
path = "diff/differential.rs"

[[test]]
name = "test_workos_startup"
path = "test/test_workos_startup.rs"
# It compares the engines against each other, so it needs all of them; with any
# turned off cargo skips the target rather than failing to build it.
required-features = ["sqlite", "postgres", "mysql"]

[features]
# All forwarded: the cfg'd code lives in resonate-server-dbms, except blob,
# which is its own crate — gating it keeps object_store out of a build that
# does not run it.
default = ["sqlite", "postgres", "mysql", "blob"]
sqlite = ["resonate-server-dbms/sqlite"]
postgres = ["resonate-server-dbms/postgres"]
mysql = ["resonate-server-dbms/mysql"]
blob = ["dep:resonate-server-blob", "dep:object_store"]
concurrency-stress = ["resonate-server-dbms/concurrency-stress"]

[dependencies]
resonate-auth = { path = "crates/resonate-auth" }
resonate-core = { path = "crates/resonate-core" }
resonate-gateway-http = { path = "crates/resonate-gateway-http" }
resonate-gateway-web = { path = "crates/resonate-gateway-web" }
resonate-server-blob = { path = "crates/resonate-server-blob", optional = true }
resonate-server-dbms = { path = "crates/resonate-server-dbms", default-features = false }
resonate-timer-wheel = { path = "crates/resonate-timer-wheel" }
resonate-transport-gcps = { path = "crates/resonate-transport-gcps" }
resonate-transport-http-poll = { path = "crates/resonate-transport-http-poll" }
resonate-transport-http-push = { path = "crates/resonate-transport-http-push" }
resonate-worker-bash = { path = "crates/resonate-worker-bash" }
jsonwebtoken = "9"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
cron = "0.12"
chrono = "0.4"
async-stream = "0.3"
prometheus = "0.13"
lazy_static = "1"
fastrand = "2"
tracing-appender = "0.2"
async-trait = { workspace = true }
validator = { workspace = true }
url = { workspace = true }
base64 = "0.22"
object_store = { version = "0.14.1", features = ["aws"], optional = true }
tower-http = { version = "0.6", features = ["trace", "catch-panic", "cors"] }

[dev-dependencies]
toml = "0.8"
